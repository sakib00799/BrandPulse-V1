[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brandpulse-bd"
version = "0.1.0"
description = "Bangla/Banglish customer-feedback intelligence platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "matplotlib>=3.8,<4",
  "pandas>=2.2,<4",
  "pyarrow>=15,<25",
  "scikit-learn>=1.5,<2",
  "sqlalchemy>=2.0,<3",
  "torch>=2.4,<3",
  "transformers>=4.48,<6",
  "uvicorn[standard]>=0.34,<1",
  "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
